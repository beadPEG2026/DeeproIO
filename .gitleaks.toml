title = "DeeproIO secret scanning"
[extend]
useDefault = true

[[allowlists]]
description = "Database setting identifiers"
condition = "AND"
paths = ['source/newex/app/Helpers/Settings/SettingsHelper\.php$']
regexTarget = "match"
regexes = ["key' => 'trade\\.lc_dq(?:30|90|180|365)"]

[[allowlists]]
description = "Public blockchain token identifiers"
condition = "AND"
paths = ['resources/data/stock-tokens\.json$']
regexTarget = "match"
regexes = ['tokenId"\s*:']

[[allowlists]]
description = "Third party browser shortcut constants and public analytics identifiers"
condition = "AND"
paths = ['public/(?:alternative|frontend)/js/']
regexTarget = "match"
regexes = ['SHORTKEY=', 'amplitudeApiKey:']

[[allowlists]]
description = "Webhook idempotency test fixture"
condition = "AND"
paths = ['Merchant/Tests/Feature/WebhookTest\.php$']
regexTarget = "match"
regexes = ["idempotency_key' =>"]

[[allowlists]]
description = "Public news cache namespace"
condition = "AND"
paths = ['source/newex/app/Services/Market/CryptoNews\.php$']
regexTarget = "match"
regexes = ["CACHE_KEY\\s*:\\s*'crypto-news\\.v2\\.panews\\."]
